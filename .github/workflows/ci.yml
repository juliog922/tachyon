name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: pip install lizard nvidia-cuda-nvcc-cu12
      - run: echo "$(python -c 'import nvidia.cuda_nvcc as m; print(m.__path__[0])')/bin" >> "$GITHUB_PATH"
      - run: ./ci.sh